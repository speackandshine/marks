<!doctype html>
<html lang="si">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>සිසු ලකුණු</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  // ප්‍රධාන script එක ආරම්භ වීමට නොහැකි වුවහොත් "ලබාගනිමින්" ලෙස හිරවී නොසිට හේතුව පෙන්වයි.
  window.addEventListener('error', function () {
    var el = document.getElementById('splash');
    if (el) el.textContent = 'පිටුව ආරම්භ කළ නොහැකි විය. පිටුව refresh කරන්න.';
  });
</script>
<style>
  :root {
    color-scheme: light;
    --board:#17362f; --board-2:#234a41; --board-line:#3d6358; --chalk:#f1f5ef; --chalk-2:#bcd0c6;
    --chalk-yellow:#f3c64f; --tray:#a9743f;
    --page:#eef2ed; --surface:#fdfefc; --ink:#16241f; --ink-2:#47584f; --muted:#62716a;
    --line:#dfe6e0; --base:#bccac1; --s1:#1c7a64; --s2:#8a9790; --wash:rgba(28,122,100,.1);
    --l1:#7cc4ae; --l2:#47a58b; --l3:#1c7a64; --l4:#0e4f41;
    --ok:#17603f; --err:#b3261e; --warn:#7a4f00;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--page); color:var(--ink);
    font-family:"Noto Sans Sinhala","Iskoola Pota",system-ui,sans-serif; font-size:16px; line-height:1.5; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; background:none; border:0; padding:0; }
  :focus-visible { outline:2px solid var(--chalk-yellow); outline-offset:2px; }
  main :focus-visible { outline-color:var(--s1); }
  h1, h2, h3, p { margin:0; }

  #app { display:grid; grid-template-columns:216px minmax(0,1fr); min-height:100vh; }
  #side { background:var(--board); color:var(--chalk); padding:22px 12px; position:sticky; top:0; height:100vh;
    display:flex; flex-direction:column; gap:4px; }
  .brand { font-size:19px; font-weight:700; padding:0 12px 16px; }
  .nav { display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border-radius:8px; text-align:left;
    color:var(--chalk-2); font-weight:500; }
  .nav svg { width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav:hover { background:var(--board-2); color:var(--chalk); }
  .nav[aria-current="page"] { background:var(--board-2); color:var(--chalk-yellow); font-weight:700; }
  .side-foot { margin-top:auto; display:grid; gap:2px; font-size:14px; }
  .side-foot a, .side-foot button { color:var(--chalk-2); padding:6px 12px; text-align:left; text-decoration:none; border-radius:6px; }
  .side-foot a:hover, .side-foot button:hover { color:var(--chalk); background:var(--board-2); }

  #board { background:var(--board); color:var(--chalk); padding:22px 28px 22px 12px; border-bottom:6px solid var(--tray); }
  .board-top { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px 20px; }
  #board h1 { font-size:26px; line-height:1.25; font-weight:700; }
  .back { color:var(--chalk-2); font-size:15px; margin-bottom:4px; }
  .back:hover { color:var(--chalk); }
  .seg { display:inline-flex; border:1px solid var(--board-line); border-radius:8px; overflow:hidden; }
  .seg button { padding:7px 13px; color:var(--chalk-2); font-size:15px; font-weight:500; }
  .seg button + button { border-left:1px solid var(--board-line); }
  .seg button:hover { color:var(--chalk); background:var(--board-2); }
  .seg button[aria-pressed="true"] { background:var(--chalk-yellow); color:var(--board); font-weight:700; }
  .period { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:14px; }
  .arrow { width:38px; height:38px; border:1px solid var(--board-line); border-radius:8px; color:var(--chalk); font-size:20px; line-height:1; }
  .arrow:hover:not(:disabled) { background:var(--board-2); }
  .arrow:disabled { opacity:.35; cursor:default; }
  .period-label { font-size:18px; font-weight:600; min-width:170px; text-align:center; }
  .range { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .range input { background:var(--board-2); border:1px solid var(--board-line); color:var(--chalk); color-scheme:dark;
    padding:6px 10px; border-radius:8px; }
  .ruler { display:grid; grid-template-columns:auto repeat(11,minmax(0,1fr)); margin-top:14px; max-width:680px;
    border:1px solid var(--board-line); border-radius:8px; overflow:hidden; }
  .ruler button { min-height:40px; padding:0 12px; color:var(--chalk-2); font-weight:600; }
  .ruler button + button { border-left:1px solid var(--board-line); padding:0 2px; }
  .ruler button:hover { background:var(--board-2); color:var(--chalk); }
  .ruler button[aria-pressed="true"] { background:var(--chalk-yellow); color:var(--board); }
  .figures { display:flex; flex-wrap:wrap; align-items:flex-end; gap:16px 44px; margin-top:20px; }
  .hero-num { font-size:60px; line-height:1; font-weight:700; }
  .hero-num small { font-size:22px; font-weight:500; color:var(--chalk-2); }
  .hero-cap { color:var(--chalk-2); font-size:15px; margin-top:6px; }
  .fig b { display:block; font-size:24px; font-weight:600; line-height:1.25; }
  .fig span { color:var(--chalk-2); font-size:14px; }

  main { padding:24px 28px 40px 12px; min-width:0; }
  #side + #content { min-width:0; }
  .grid { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:22px; }
  .panel { grid-column:span 6; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:18px 20px; min-width:0; }
  .panel.wide { grid-column:span 12; }
  .panel.third { grid-column:span 4; }
  .panel h2 { font-size:18px; font-weight:700; }
  .panel .sub { color:var(--muted); font-size:14px; margin:2px 0 14px; }
  .empty { padding:28px 8px; text-align:center; color:var(--ink-2); }
  .empty button, .primary { background:var(--s1); color:#fff; font-weight:600; padding:10px 18px; border-radius:8px; margin-top:10px; }
  .link { color:var(--s1); font-weight:600; margin-top:12px; }
  .link:hover { text-decoration:underline; }

  .legend { display:flex; flex-wrap:wrap; gap:4px 16px; font-size:14px; color:var(--ink-2); margin-bottom:10px; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
  .legend i.ln { height:3px; width:16px; border-radius:2px; vertical-align:4px; }
  .chart { width:100%; }
  .chart svg { display:block; width:100%; overflow:visible; touch-action:pan-y; }
  .chart text { font-family:inherit; font-size:12px; fill:var(--muted); font-variant-numeric:tabular-nums; }
  .chart text.val { fill:var(--ink); font-weight:700; font-size:13px; }

  .bars { display:grid; gap:2px; }
  .bars.two { grid-template-columns:repeat(2,minmax(0,1fr)); grid-auto-flow:column; column-gap:32px; }
  .bar { display:grid; grid-template-columns:minmax(0,42%) minmax(0,1fr) 42px; gap:10px; align-items:center;
    padding:4px 4px; width:100%; text-align:left; border-radius:6px; font-size:15px; }
  .bar:hover { background:#eef4ef; }
  .bar .nm { overflow-wrap:anywhere; line-height:1.35; }
  .bar .tk { height:14px; display:block; border-left:1px solid var(--base); }
  .bar .fl { display:block; height:100%; background:var(--s1); border-radius:0 4px 4px 0; min-width:2px; }
  .bar .v { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .bar.none .v { color:var(--muted); font-weight:400; }

  .stack { display:grid; grid-template-columns:minmax(0,92px) minmax(0,1fr); gap:10px; align-items:center;
    padding:4px; width:100%; text-align:left; border-radius:6px; font-size:15px; }
  button.stack:hover { background:#eef4ef; }
  .segs { display:flex; gap:2px; height:22px; }
  .segs.tall { height:28px; }
  .segs span { display:flex; align-items:center; padding-left:6px; border-radius:4px; font-size:13px; font-weight:600; min-width:0; overflow:hidden; }
  .nomark { color:var(--muted); font-size:14px; }
  .single { display:block; }
  .note { color:var(--ink-2); font-size:14px; margin-top:10px; }

  .names { list-style:none; padding:0; margin:0; }
  .names li + li { border-top:1px solid var(--line); }
  .names button { display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:8px; width:100%; padding:8px 4px; text-align:left; }
  .names button:hover { background:#eef4ef; }
  .names .n { color:var(--muted); font-variant-numeric:tabular-nums; }
  .names .who { overflow-wrap:anywhere; line-height:1.35; }
  .names .who small { color:var(--muted); font-size:13px; margin-left:6px; }
  .names .sc { font-weight:600; font-variant-numeric:tabular-nums; }

  .tools { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:14px; }
  .tools input { flex:1 1 200px; padding:9px 12px; border:1px solid var(--base); border-radius:8px; background:#fff; }
  .tools label { color:var(--ink-2); font-size:15px; }
  .tools select { padding:9px 10px; border:1px solid var(--base); border-radius:8px; background:#fff; }
  .scroll { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:15px; }
  th { text-align:left; color:var(--ink-2); font-weight:600; font-size:14px; border-bottom:1px solid var(--base); padding:8px 10px; white-space:nowrap; }
  td { padding:8px 10px; border-bottom:1px solid var(--line); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  td button { font-weight:600; color:var(--s1); text-align:left; }
  td button:hover { text-decoration:underline; }
  .lv { white-space:nowrap; }
  .lv i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; }
  .reg-panel { margin-bottom:22px; }
  .dl { display:flex; flex-wrap:wrap; gap:10px; }
  .dl .primary { margin:0; }
  .dl .primary.alt { background:#fff; color:var(--s1); border:1px solid var(--s1); }
  .dl .primary:disabled { opacity:.6; cursor:default; }
  .reg th, .reg td { border:1px solid var(--line); text-align:center; }
  .reg th { background:#e7eee9; color:var(--ink); }
  .reg .st { position:sticky; left:0; text-align:left; background:var(--surface); min-width:150px; max-width:190px; white-space:normal; }
  .reg th.st { background:#e7eee9; }

  form.entry { max-width:440px; margin:0 auto; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-weight:600; margin:0 0 6px; }
  .field input, .field select, .save { width:100%; font-size:17px; padding:11px 12px; border:1px solid var(--base); border-radius:8px; background:#fff; }
  .field input[readonly] { background:#e9efea; font-weight:600; }
  .save { background:var(--s1); border-color:var(--s1); color:#fff; font-weight:700; }
  .save:disabled { opacity:.5; cursor:default; }
  .warn { min-height:21px; margin-top:6px; font-size:14px; color:var(--warn); }
  #status { min-height:24px; margin-top:14px; font-weight:600; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--err); }

  .form-narrow { max-width:400px; }
  .inline { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .inline .field { flex:1 1 170px; margin:0; }
  .inline .primary { margin:0; min-height:48px; }
  .notice { padding:10px 12px; border-radius:8px; background:#e7f2ec; color:var(--ok); font-weight:600; margin-bottom:14px; overflow-wrap:anywhere; }
  .notice.err { background:#fbeaea; color:var(--err); }
  .temp { display:block; font-size:22px; letter-spacing:1px; margin-top:4px; color:var(--ink); }
  .acts { display:flex; flex-wrap:wrap; gap:6px 14px; }
  .acts button { color:var(--s1); font-weight:600; font-size:14px; }
  .acts button.danger { color:var(--err); }
  .stu th:first-child, .stu td:first-child { width:72px; font-variant-numeric:tabular-nums; }
  .stu .acts { justify-content:flex-end; }
  .edit-name { width:100%; padding:7px 9px; border:1px solid var(--base); border-radius:6px; background:#fff; }
  td select { padding:5px 6px; border:1px solid var(--base); border-radius:6px; background:#fff; }
  .muted { color:var(--muted); }
  .who-box { padding:0 12px 10px; color:var(--chalk-2); font-size:14px; }
  .who-box b { display:block; color:var(--chalk); font-size:15px; }
  .stack-list { display:grid; gap:8px; margin-top:6px; }
  .stack-list button, .stack-list a { display:block; padding:12px; border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); font-weight:600; text-align:left; text-decoration:none; }
  #tip { position:fixed; z-index:20; display:none; pointer-events:none; background:var(--ink); color:#fff; padding:7px 10px;
    border-radius:6px; font-size:14px; max-width:230px; }
  #tip div { display:flex; gap:8px; justify-content:space-between; }
  #tip b { font-variant-numeric:tabular-nums; }
  #tip .hd { color:#c7d3cc; font-size:13px; }
  #splash { padding:64px 20px; text-align:center; color:var(--ink-2); }

  @media (max-width:820px) {
    #app { display:block; padding-bottom:70px; }
    #side { position:fixed; z-index:10; left:0; right:0; bottom:0; top:auto; height:auto; padding:4px 4px calc(4px + env(safe-area-inset-bottom));
      flex-direction:row; border-top:4px solid var(--tray); }
    .brand, .side-foot, .desk { display:none; }
    .nav { flex:1 1 0; flex-direction:column; gap:1px; padding:6px 2px; font-size:12px; text-align:center; }
    #board { padding:16px; }
    #board h1 { font-size:22px; }
    main { padding:16px; }
    .grid { gap:16px; }
    .panel, .panel.wide, .panel.third { grid-column:span 12; padding:14px; }
    .bars.two { grid-template-columns:minmax(0,1fr); grid-template-rows:none !important; grid-auto-flow:row; }
    .bar { grid-template-columns:minmax(0,46%) minmax(0,1fr) 38px; }
    .hero-num { font-size:52px; }
    .figures { gap:12px 24px; }
    .seg { display:flex; width:100%; }
    .seg button { flex:1 1 auto; padding:7px 4px; font-size:14px; }
    .period-label { flex:1; min-width:0; font-size:16px; }
    .ruler button:first-child { padding:0 8px; font-size:14px; }
    .hide-sm { display:none; }
    th, td { padding:8px 6px; }
    .cards thead { display:none; }
    .cards, .cards tbody, .cards tr, .cards td { display:block; width:100%; }
    .cards tr { padding:10px 0; border-bottom:1px solid var(--base); }
    .cards td { border:0; padding:3px 0; }
  }
</style>
<script src="config.js"></script>
</head>
<body>
<div id="app">
  <aside id="side"></aside>
  <div id="content">
    <div id="board"></div>
    <main id="view"><div id="splash">ලකුණු ලබාගනිමින්...</div></main>
  </div>
</div>
<div id="tip" role="status"></div>
<script>
  var MONTHS = ['ජනවාරි','පෙබරවාරි','මාර්තු','අප්‍රේල්','මැයි','ජූනි','ජූලි','අගෝස්තු','සැප්තැම්බර්','ඔක්තෝබර්','නොවැම්බර්','දෙසැම්බර්'];
  var DAY = 86400000;
  // ලකුණු මට්ටම්: සාමාන්‍යය උපරිම ලකුණුවලින් කොපමණ කොටසක්ද යන්න අනුව
  var LEVELS = [
    { name:'ඉහළ', from:0.8, color:'var(--l4)', ink:'#ffffff' },
    { name:'හොඳ', from:0.6, color:'var(--l3)', ink:'#ffffff' },
    { name:'මධ්‍යම', from:0.4, color:'var(--l2)', ink:'#16241f' },
    { name:'අඩු', from:0, color:'var(--l1)', ink:'#16241f' }
  ];
  var ICONS = {
    overview:'M4 20V10M10 20V4M16 20v-7M21 20H3',
    ranking:'M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01',
    register:'M4 5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2V5zM9 8h7',
    entry:'M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z',
    students:'M16 20v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 10a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6',
    teachers:'M12 3l9 5-9 5-9-5zM7 11v5c3 2 7 2 10 0v-5',
    account:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'
  };
  function navItems() {
    var items = [['overview', 'දළ විශ්ලේෂණය'], ['ranking', 'ස්ථාන ලැයිස්තුව'], ['register', 'ලකුණු පොත']];
    if (state.user) {
      items.push(['entry', 'ලකුණු ඇතුළත් කිරීම'], ['students', 'සිසුන්', true]);
      if (state.user.role === 'admin') items.push(['teachers', 'ගුරුවරුන්', true]);
      items.push(['account', 'මගේ ගිණුම']);
    } else {
      items.push(['login', 'ගුරු පිවිසුම']);
    }
    return items;
  }
  var state = { view:'overview', grade:'all', mode:'month', anchor:'', from:'', to:'', student:null,
                sort:'total', search:'', data:null, user:null, token:null, notice:null,
                manageGrade:null, expired:null, pending:null, renameKey:null, confirmKey:null, tempPassword:null };
  var entry = { grade:'', number:'', date:'', mark:'', status:'', statusKind:'', queue:[], sending:[], failed:[], lastSaved:'' };
  var observer = null;
  var SESSION_ERROR = 'පිවිසුම කල් ඉකුත් වී ඇත. නැවත පිවිසෙන්න.';

  // ===== Server ඇමතුම් =====
  // credentials:'omit' නිසා Google ගිණුම් තොරතුරු නොයවයි. එබැවින් /u/6/ ගැටලුව නැහැ.
  function api(name, args, ok, fail) {
    function failed(err) {
      if (err.message === SESSION_ERROR) {
        forgetSession();
        state.notice = { text:SESSION_ERROR + queueLostText(), kind:'err' };
        state.view = 'login';
        if (state.data) render(); else load();
      } else if (fail) {
        fail(err);
      } else {
        state.notice = { text:err.message, kind:'err' };
        render();
      }
    }
    fetch(window.API_URL, { method:'POST', credentials:'omit', redirect:'follow',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body:JSON.stringify({ fn:name, args:args }) })
      .then(function (r) {
        if (!r.ok) throw new Error('bad status');

  function waitingCount() { return entry.queue.length + entry.sending.length; }
  function showQueue() {
    var waiting = waitingCount();
    var el = document.getElementById('status');
    if (entry.failed.length) {
      entry.status = 'Save නොවූ ලකුණු: ' + entry.failed.join(', ') + '. මේවා නැවත ඇතුළත් කරන්න.';
      entry.statusKind = 'err';
    } else if (waiting) {
      entry.status = 'Save වෙමින්: ලකුණු ' + waiting;
      entry.statusKind = '';
    } else {
      entry.status = entry.lastSaved ? 'සියල්ල Save වුණා ✓ ' + entry.lastSaved : '';
      entry.statusKind = entry.lastSaved ? 'ok' : '';
    }
    if (el) { el.textContent = entry.status; el.className = entry.statusKind; }
  }
  function revertItem(item, reason) {
    if (item.student.m[item.date] === Number(item.mark)) {
      if (item.old === undefined) delete item.student.m[item.date]; else item.student.m[item.date] = item.old;
    }
    entry.failed.push(item.name + (reason ? ' (' + reason + ')' : ''));
  }
  function pumpQueue() {
    if (entry.sending.length || !entry.queue.length) return;
    entry.sending = entry.queue.splice(0, 50);
    entry.failed = [];
    api('saveMarks', [state.token, entry.sending.map(function (i) {
      return { grade:i.grade, no:i.no, date:i.date, mark:i.mark };
    })], function (results) {
      var batch = entry.sending;
      entry.sending = [];
      results.forEach(function (r, i) {
        if (r.error) { revertItem(batch[i], r.error); return; }
        var text = r.name + ' - ' + r.date + ' - ලකුණු ' + r.mark;
        if (r.previous !== null && r.previous !== r.mark) text += ' (පෙර ලකුණු ' + r.previous + ')';
        entry.lastSaved = text;
      });
      showQueue();
      pumpQueue();
    }, function (err) {
      var batch = entry.sending.concat(entry.queue);
      entry.sending = []; entry.queue = [];
      batch.forEach(function (item) { revertItem(item, err.message); });
      showQueue();
    });
  }

  function queueLostText() {

                 api('removeTeacher', [state.token, t.username], function () { state.confirmKey = null; state.notice = { text:t.name + ' ඉවත් කළා.', kind:'ok' }; render(); });
               } } }, 'ඔව්, ඉවත් කරන්න'), h('button', { type:'button', on:{ click:function () { state.confirmKey = null; render(); } } }, 'එපා')]
            : [h('button', { type:'button', on:{ click:function () { update({ username:t.username, active:!t.active }); } } }, t.active ? 'අවසර නවත්වන්න' : 'අවසර දෙන්න'),
               h('button', { type:'button', on:{ click:function () {
                 api('resetTeacherPassword', [state.token, t.username], function (r) { showTemp(t.username, r.password); });
               } } }, 'මුරපදය නැවත සකසන්න'),
               h('button', { type:'button', 'class':'danger', on:{ click:function () { state.confirmKey = key; render(); } } }, 'ඉවත් කරන්න')];
          return h('tr', {}, h('td', {}, t.name), h('td', {}, t.username),
            h('td', {}, h('select', { 'aria-label':t.name + ' පන්තිය', on:{ change:function (e) { update({ username:t.username, grade:e.target.value }); } } },
              state.data.grades.map(function (g) { return h('option', { value:g.grade, selected:g.grade === t.grade }, 'ශ්‍රේණිය ' + g.grade); }))),
            h('td', {}, t.active ? 'සක්‍රිය' : 'නවතා ඇත'), h('td', {}, h('div', { 'class':'acts' }, acts)));
        })))));
    });
    api('listRemovedStudents', [state.token], function (rows) {
      if (!rows.length) { add(removedPanel, h('p', { 'class':'muted' }, 'ඉවත් කළ සිසුන් නැහැ.')); return; }
      add(removedPanel, h('div', { 'class':'scroll' }, h('table', {},
        h('thead', {}, h('tr', {}, h('th', {}, 'නම'), h('th', { 'class':'num' }, 'ශ්‍රේණිය'), h('th', { 'class':'num' }, 'අංකය'), h('th', {}, 'ඉවත් කළේ'), h('th', {}, ''))),
        h('tbody', {}, rows.map(function (r) {
          return h('tr', {}, h('td', {}, r.name), h('td', { 'class':'num' }, r.grade), h('td', { 'class':'num' }, r.no), h('td', {}, r.by + ', ' + r.when),
            h('td', {}, h('div', { 'class':'acts' }, h('button', { type:'button', on:{ click:function () {
              api('restoreStudent', [state.token, r.id], function () { state.notice = { text:r.name + ' නැවත එක් කළා.', kind:'ok' }; load(true); });
            } } }, 'නැවත එක් කරන්න'))));
        })))));
    });
  }

  // ===== වාර්තා බාගැනීම (PDF / Excel) =====
  var SCHOOL = 'නලගම සිංහල කනිටු විදුහල';
  var PROGRAM = 'Speack and Shine';
  var REPORT_TITLE = 'සිසු ලකුණු වාර්තාව';
  var LIBS = {
    pdf:['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js',
         'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'],
    xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js']
  };
  var PAGE_W = 1123, PAGE_H = 794, DATES_PER_PAGE = 15;
  var loadedLibs = {};
  function loadScript(src) {
    if (!loadedLibs[src]) {
      loadedLibs[src] = new Promise(function (ok, bad) {
        var el = document.createElement('script');
        el.src = src;
        el.onload = ok;
        el.onerror = function () {
          delete loadedLibs[src]; el.remove();
          bad(new Error('බාගැනීමට අවශ්‍ය කොටස් ලබාගත නොහැකි විය. අන්තර්ජාලය පරීක්ෂා කර නැවත උත්සාහ කරන්න.'));
        };
        document.head.appendChild(el);
      });
    }
    return loadedLibs[src];
  }
  function loadLibs(kind) {
    return LIBS[kind].reduce(function (chain, src) { return chain.then(function () { return loadScript(src); }); }, Promise.resolve());
  }
  function slash(iso) { return iso.replace(/-/g, '/'); }
  function periodText() {
    var p = period();
    return state.mode === 'range' ? slash(p.from) + ' - ' + slash(p.to) : p.label + ' (' + slash(p.from) + ' - ' + slash(p.to) + ')';
  }
  /** ලකුණු ඇතුළත් කළ දින පමණක් ඇතුළත් වේ. */
  function reportData() {
    var p = period();
    return selectedGrades(state.grade).map(function (g) {
      var res = compute(g.grade, p), lookup = {};
      res.rows.forEach(function (r) { lookup[r.key] = {}; r.marks.forEach(function (m) { lookup[r.key][m[0]] = m[1]; }); });
      ranked(res.rows, 'total'); // මුළු ලකුණු අනුව ස්ථාන, සමාන ලකුණුවලට එකම ස්ථානය
      return { grade:g.grade, rows:res.rows, dates:Object.keys(res.byDate).sort(), lookup:lookup };
    }).filter(function (rep) { return rep.dates.length && rep.rows.length; });
  }
  function reportFile(ext) {
    var p = period();
    return 'marks-' + (state.grade === 'all' ? 'all-grades' : 'grade-' + state.grade) + '_' + p.from + '_' + p.to + '.' + ext;
  }
  function avgText(r) { return r.avg === null ? '' : fmt(r.avg); }

  function downloadExcel(done) {
    var reps = reportData();
    return loadLibs('xlsx').then(function () {
      var wb = XLSX.utils.book_new();
      reps.forEach(function (rep) {
        var head = ['අංකය', 'සිසුවාගේ නම'].concat(rep.dates.map(slash), ['මුළු', 'සාමාන්‍යය', 'ස්ථානය']);
        var aoa = [[REPORT_TITLE], [SCHOOL], [PROGRAM], ['ශ්‍රේණිය ' + rep.grade + ', ' + periodText()], [], head];
        rep.rows.forEach(function (r) {
          var no = Number(r.no);
          aoa.push([isNaN(no) ? r.no : no, r.name].concat(rep.dates.map(function (d) {
            var v = rep.lookup[r.key][d]; return v === undefined ? '' : v;
          }), [r.days ? r.total : '', r.avg === null ? '' : Math.round(r.avg * 10) / 10, r.rank || '']));
        });
        var ws = XLSX.utils.aoa_to_sheet(aoa);
        ws['!merges'] = [0, 1, 2, 3].map(function (r) { return { s:{ r:r, c:0 }, e:{ r:r, c:head.length - 1 } }; });
        ws['!cols'] = [{ wch:7 }, { wch:30 }].concat(rep.dates.map(function () { return { wch:11 }; }), [{ wch:8 }, { wch:10 }, { wch:9 }]);
        XLSX.utils.book_append_sheet(wb, ws, 'ශ්‍රේණිය ' + rep.grade);
      });
      XLSX.writeFile(wb, reportFile('xlsx'));
    });
  }

  var CELL = 'border:1px solid #9aa9a1;padding:5px 6px;';
  function pdfPage(rep, dates, last, part, parts) {
    var body = h('tbody', {});
    var head = h('tr', {},
      h('th', { style:CELL + 'width:48px' }, 'අංකය'),
      h('th', { style:CELL + 'width:220px;text-align:left' }, 'සිසුවාගේ නම'),
      dates.map(function (d) { return h('th', { style:CELL }, dates.length > 9 ? d.slice(5).replace('-', '/') : slash(d)); }),
      last ? [h('th', { style:CELL + 'width:56px' }, 'මුළු'), h('th', { style:CELL + 'width:76px' }, 'සාමාන්‍යය'), h('th', { style:CELL + 'width:62px' }, 'ස්ථානය')] : null);
    var foot = h('div', { 'class':'pdf-foot', style:'position:absolute;left:40px;right:40px;bottom:22px;display:flex;justify-content:space-between;font-size:12px;color:#5b6b63' },
      h('span', {}, 'සකස් කළේ ' + slash(state.data.today)), h('span', { 'class':'pdf-no' }, ''));
    var el = h('div', { style:'position:relative;box-sizing:border-box;width:' + PAGE_W + 'px;min-height:10px;padding:30px 40px 56px;background:#fff;color:#16241f;font-family:"Noto Sans Sinhala","Iskoola Pota",sans-serif' },
      h('div', { style:'text-align:center;border-bottom:3px solid #1c7a64;padding-bottom:10px;margin-bottom:12px' },
        h('div', { style:'font-size:24px;font-weight:700;line-height:1.3' }, SCHOOL),
        h('div', { style:'font-size:17px;font-weight:600;color:#1c7a64;line-height:1.4' }, PROGRAM),
        h('div', { style:'font-size:18px;font-weight:700;margin-top:4px' }, REPORT_TITLE)),
      h('div', { style:'display:flex;justify-content:space-between;font-size:15px;margin-bottom:10px' },
        h('b', {}, 'ශ්‍රේණිය ' + rep.grade),
        h('span', {}, periodText() + (parts > 1 ? ', දින කොටස ' + (part + 1) + ' / ' + parts : ''))),
      h('table', { style:'width:100%;border-collapse:collapse;font-size:' + (dates.length > 9 ? 13 : 14) + 'px;text-align:center' },
        h('thead', { style:'background:#e2ece6' }, head), body),
      foot);
    return { el:el, body:body };
  }
  function pdfRow(rep, r, dates, last, i) {
    return h('tr', { style:i % 2 ? 'background:#f5f8f6' : '' },
      h('td', { style:CELL }, r.no),
      h('td', { style:CELL + 'text-align:left' }, r.name),
      dates.map(function (d) { var v = rep.lookup[r.key][d]; return h('td', { style:CELL }, v === undefined ? '' : String(v)); }),
      last ? [h('td', { style:CELL + 'font-weight:700' }, r.days ? String(r.total) : ''), h('td', { style:CELL }, avgText(r)), h('td', { style:CELL + 'font-weight:700' }, r.rank ? String(r.rank) : '')] : null);
  }
  /** දිගු නම් පේළි දෙකකට ගියත් පිටුවට ගැළපෙන ලෙස පේළි එකින් එක එකතු කර මනියි. */
  function buildPdfPages(reps, host) {
    var pages = [];
    reps.forEach(function (rep) {
      var parts = [];
      for (var i = 0; i < rep.dates.length; i += DATES_PER_PAGE) parts.push(rep.dates.slice(i, i + DATES_PER_PAGE));
      parts.forEach(function (dates, part) {
        var last = part === parts.length - 1, next = 0;
        while (next < rep.rows.length) {
          var pg = pdfPage(rep, dates, last, part, parts.length), added = 0;
          host.appendChild(pg.el);
          while (next < rep.rows.length) {
            var tr = pdfRow(rep, rep.rows[next], dates, last, next);
            pg.body.appendChild(tr);
            if (pg.el.offsetHeight > PAGE_H && added) { pg.body.removeChild(tr); break; }
            added += 1; next += 1;
          }
          pg.el.style.height = PAGE_H + 'px';
          pages.push(pg.el);
        }
      });
    });
    pages.forEach(function (el, i) { el.querySelector('.pdf-no').textContent = 'පිටුව ' + (i + 1) + ' / ' + pages.length; });
    return pages;
  }
  function downloadPdf() {
    var reps = reportData();
    return loadLibs('pdf').then(function () {
      return document.fonts && document.fonts.ready;
    }).then(function () {
      var host = h('div', { style:'position:fixed;left:-20000px;top:0' });
      document.body.appendChild(host);
      var pages = buildPdfPages(reps, host);
      var doc = new window.jspdf.jsPDF({ orientation:'landscape', unit:'mm', format:'a4', compress:true });
      return pages.reduce(function (chain, el, i) {
        return chain.then(function () {
          return html2canvas(el, { scale:2, backgroundColor:'#ffffff', logging:false, width:PAGE_W, height:PAGE_H, windowWidth:PAGE_W });
        }).then(function (canvas) {
          if (i) doc.addPage('a4', 'landscape');
          doc.addImage(canvas.toDataURL('image/jpeg', 0.92), 'JPEG', 0, 0, 297, 210);
        });
      }, Promise.resolve()).then(function () {
        doc.save(reportFile('pdf'));
      }).finally(function () { host.remove(); });
    });
  }
  function downloadPanel() {
    var reps = reportData(), status = h('p', { 'class':'note', role:'status' });
    function run(btn, work, label) {
      btn.disabled = true; btn.textContent = 'සකසමින්...'; status.textContent = '';
      work().then(function () { status.textContent = 'බාගත කළා ✓'; }, function (err) { status.textContent = err.message; })
        .then(function () { btn.disabled = false; btn.textContent = label; });
    }
    var pdfBtn = h('button', { type:'button', 'class':'primary', disabled:!reps.length }, 'PDF බාගන්න');
    var xlsBtn = h('button', { type:'button', 'class':'primary alt', disabled:!reps.length }, 'Excel බාගන්න');
    pdfBtn.addEventListener('click', function () { run(pdfBtn, downloadPdf, 'PDF බාගන්න'); });
    xlsBtn.addEventListener('click', function () { run(xlsBtn, downloadExcel, 'Excel බාගන්න'); });
    var what = state.grade === 'all' ? 'සියලු ශ්‍රේණි, එක් එක් ශ්‍රේණිය වෙනම පිටුවක' : 'ශ්‍රේණිය ' + state.grade;
    return h('section', { 'class':'panel wide reg-panel' }, h('h2', {}, 'වාර්තා බාගන්න'),
      h('p', { 'class':'sub' }, what + ', ' + periodText() + '. ලකුණු ඇතුළත් කළ දින පමණක් වගුවේ ඇතුළත් වේ.'),
      reps.length ? h('div', { 'class':'dl' }, pdfBtn, xlsBtn) : h('p', { 'class':'nomark' }, 'මෙම කාලයට ලකුණු ඇතුළත් කර නැති නිසා වාර්තාවක් නැහැ.'),
      status);
  }

  // ===== පාලනය =====
  function setMode(mode) {
    if (mode === state.mode) return;
    var p = period();
    if (mode === 'range') {
      state.from = p.from > state.data.today ? state.data.today : p.from;
      state.to = p.to > state.data.today ? state.data.today : p.to;
    } else if (p.from <= state.data.today && state.data.today <= p.to) {
      state.anchor = state.data.today;
    } else {
      state.anchor = state.mode === 'range' ? state.to : state.anchor;
    }
    state.mode = mode;
    render();
  }
  function setRange() {
    var a = document.getElementById('from').value, b = document.getElementById('to').value;
    if (!a || !b) return;
    state.from = a < b ? a : b; state.to = a < b ? b : a;
    render();
  }
  function move(dir) {
    var v = shifted(dir);
    if (v.anchor) state.anchor = v.anchor; else { state.from = v.from; state.to = v.to; }
    render();
  }
  function render() {
    if (state.pending) { useData(state.pending); state.pending = null; }
    hideTip();
    if (observer) observer.disconnect();
    var view = clear(document.getElementById('view'));
    if (!state.user && ['entry', 'students', 'teachers', 'account'].indexOf(state.view) !== -1) state.view = 'login';
    if (state.view === 'teachers' && !isAdmin()) state.view = 'overview';
    if (state.view === 'login' && state.user) state.view = 'overview';
    renderSide();
    var which = state.grade;
    if (state.view === 'student') which = Number(state.student.split('_')[0]);
    var res = compute(which, period()), prev = compute(which, previousPeriod());
    renderBoard(res, prev);
    if (state.view === 'overview') renderOverview(view, res);
    else if (state.view === 'ranking') renderRanking(view, res);
    else if (state.view === 'register') renderRegister(view, res);
    else if (state.view === 'student') renderStudent(view, res);
    else if (state.view === 'login') renderLogin(view);
    else if (state.view === 'account') renderAccount(view);
    else if (state.view === 'students') renderStudents(view);
    else if (state.view === 'teachers') renderTeachers(view);
    else renderEntry(view);
  }
  function prepare(data) {
    data.grades.forEach(function (g) {
      g.students.forEach(function (st) {
        st.m = {};
        st.marks.forEach(function (v, i) { if (v !== null) st.m[g.dates[i]] = v; });
      });
    });
    return data;
  }
  function useData(data) {
    if (!state.anchor || state.anchor === (state.data && state.data.today)) state.anchor = data.today;
    state.data = data;
  }
  function savedData() {
    try { var raw = localStorage.getItem('marks-data'); return raw ? JSON.parse(raw) : null; } catch (e) { return null; }
  }
  function rememberData(data) {
    try { localStorage.setItem('marks-data', JSON.stringify(data)); } catch (e) {}
  }
  var INPUT_VIEWS = ['entry', 'students', 'teachers', 'account', 'login'];
  function load(fresh) {
    var view = document.getElementById('view');
    if (fresh === true) view.style.opacity = '.55';
    api(fresh === true && state.token ? 'getFreshData' : 'getDashboardData', fresh === true && state.token ? [state.token] : [], function (data) {
      rememberData(data);
      prepare(data);
      view.style.opacity = '';
      // ටයිප් කරන අතරේ පිටුව අලුත් නොකරයි. ඊළඟ වතාවේ පෙන්වයි.
      if (fresh !== true && state.data && INPUT_VIEWS.indexOf(state.view) !== -1) { state.pending = data; return; }
      useData(data);
      render();
    }, function (err) {
      view.style.opacity = '';
      if (state.data) { if (fresh === true) { state.notice = { text:err.message, kind:'err' }; render(); } return; }
      clear(view);
      add(view, h('div', { id:'splash' }, h('p', {}, err.message),
        h('button', { type:'button', 'class':'primary', on:{ click:function () { load(true); } } }, 'නැවත උත්සාහ කරන්න')));
    });
  }
  (function start() {
    if (!/^https:[/][/]script[.]google[.]com[/]macros[/]s[/].+[/]exec$/.test(window.API_URL || '')) {
      document.getElementById('splash').textContent = 'config.js ගොනුවේ Web app URL එක නිවැරදි නැහැ.';
      return;
    }
    // පෙර ලබාගත් දත්ත ක්ෂණිකව පෙන්වා, පසුබිමෙන් අලුත් කරයි.
    var saved = savedData();
    if (saved) { useData(prepare(saved)); render(); }
    var token = savedToken();
    if (token) {
      api('whoAmI', [token], function (user) {
        if (user) { state.token = token; state.user = user; } else { forgetSession(); }
        if (state.data) render();
      }, function () {});
    }
    load();
  })();
